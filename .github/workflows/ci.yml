# Intégration continue : compile, teste, et vérifie que la publication mono-fichier fonctionne,
# afin que le jour de la balise ne soit jamais la première fois qu'on l'essaie.
name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

defaults:
  run:
    shell: pwsh

jobs:
  build:
    # L'outil s'authentifie avec la session Windows : il se construit et se teste sur Windows.
    runs-on: windows-latest

    steps:
      - name: Extraire le dépôt
        uses: actions/checkout@v5

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Mettre en cache les paquets NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurer
        run: dotnet restore DevToolbox.slnx

      - name: Compiler
        # Les avertissements sont des erreurs : cette étape est le contrôle de qualité.
        run: dotnet build DevToolbox.slnx --configuration Release --no-restore

      - name: Tester
        run: >
          dotnet test DevToolbox.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=tests.trx"
          --results-directory artifacts/test-results
          --collect:"XPlat Code Coverage"

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 14

      - name: Vérifier la publication mono-fichier
        # Même commande que la publication de version, sans numéro : on s'assure ici que le
        # mono-fichier autonome se construit, pour qu'une balise n'échoue pas sur une surprise.
        run: >
          dotnet publish src/DevToolbox.Console
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishDocumentationFiles=false
          --output artifacts/publish-check
