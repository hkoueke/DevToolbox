# Sujet de l audit. Contient volontairement : un parametre d en-tete identique repete dans 14 operations,
# une reponse d erreur identique repetee, deux schemas de meme forme sous des noms differents, des
# composants inaccessibles, une operation decrite comme obsolete sans le drapeau, un corps de requete
# dont la necessite n est pas declaree, des codes de reponse quotes de deux facons, deux casses pour le
# meme en-tete, et une documentation externe vide.
