components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    jamaisUtilise:
      type: apiKey
      in: header
      name: X-cle
  schemas:
    Ressource:
      type: object
      required: [id, libelle]
      properties:
        id:
          type: string
          format: uuid
        libelle:
          type: string
          maxLength: 128
        creeLe:
          type: string
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    RessourceBis:
      type: object
      required: [id, libelle]
      properties:
        id:
          type: string
          format: uuid
        libelle:
          type: string
          maxLength: 128
        creeLe:
          type: string
    Inaccessible:
      type: object
      properties:
        champ:
          type: string
    InaccessibleAussi:
      type: array
      items:
        $ref: '#/components/schemas/Inaccessible'
  parameters:
    JamaisReference:
      name: X-inutilise
      in: header
      required: false
      schema:
        type: string
